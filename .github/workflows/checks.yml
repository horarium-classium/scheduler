name: Scheduler checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Scheduler
        uses: actions/checkout@v5
        with:
          path: scheduler
      - name: Check out Student contract consumer
        uses: actions/checkout@v5
        with:
          repository: horarium-classium/student
          path: student
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            scheduler/package-lock.json
            scheduler/scheduler/package-lock.json
      - run: npm ci
        working-directory: scheduler
      - run: npm ci
        working-directory: scheduler/scheduler
      - run: npm run publication:test:embedded
        working-directory: scheduler
      - run: npm test
        working-directory: scheduler/scheduler
      - run: npm run build -- --base=/scheduler/
        working-directory: scheduler/scheduler
