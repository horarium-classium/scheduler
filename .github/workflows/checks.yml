name: Scheduler checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/teacher/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/teacher
      - run: npm run publication:test:embedded
      - run: npm test
        working-directory: apps/teacher
      - run: npm run build -- --base=/scheduler/
        working-directory: apps/teacher
