name: Teacher Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/teacher/**'
      - '.github/workflows/teacher-pages.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/teacher/**'
      - '.github/workflows/teacher-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacher-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/teacher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/teacher/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=/horarium-classium/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/teacher/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish Teacher
        id: deployment
        uses: actions/deploy-pages@v4
